    <circle cx="50" cy="50" r="44" fill="none" stroke="#E8704A" stroke-width="5" stroke-linecap="round" stroke-dasharray="180 96" stroke-dashoffset="0" style="fill:none;stroke:rgb(232, 112, 74);color:rgb(0, 0, 0);stroke-width:5px;stroke-dasharray:180px, 96px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
