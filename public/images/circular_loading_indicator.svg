    <circle cx="50" cy="50" r="33" fill="none" stroke="#F0A58A" stroke-width="5" stroke-linecap="round" stroke-dasharray="130 77" stroke-dashoffset="30" style="fill:none;stroke:rgb(240, 165, 138);color:rgb(0, 0, 0);stroke-width:5px;stroke-dasharray:130px, 77px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  </g>

  <!-- Inner ring — very light peach -->
  <g style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
